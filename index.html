<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020617">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="index, follow">
  <meta name="description" content="Codex Soft — website currently under construction.">
  <meta property="og:title" content="Codex Soft — Under Construction">
  <meta property="og:description" content="We're building something great.">
  <meta property="og:type" content="website">

  <title>Codex Soft — Under Construction</title>

  <link rel="preload"
        as="image"
        href="codex-soft-under-construction.webp"
        type="image/webp"
        fetchpriority="high">

  <style>
    :root {
      color-scheme: dark;
      background: #020617;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(37, 99, 235, .10), transparent 38%),
        #020617;
    }

    main {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0;
    }

    .landing-image {
      display: block;
      width: 100%;
      height: auto;
      max-width: 1080px;
      max-height: 100svh;
      object-fit: contain;
    }

    @media (max-width: 700px) {
      .landing-image {
        width: 100%;
      }
    }

    @media (min-width: 1081px) {
      .landing-image {
        border-radius: 2px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <picture>
      <source srcset="codex-soft-under-construction.webp" type="image/webp">
      <img
        class="landing-image"
        src="codex-soft-under-construction.webp"
        width="1080"
        height="1920"
        alt="Codex Soft — website under construction. We're building something great.">
    </picture>
  </main>
</body>
</html>
