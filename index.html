Ls=[{title:"Go Concurrency",logo:h8,logoAlt:"Go Concurrency course logo",date:"Starts on November 30th, 2026",featured:!0,body:[{type:"p",text:"This course takes you from goroutines and channels, through coordination and synchronization, to the memory model, atomics, lock-free techniques, profiling, and production architecture."},{type:"p",text:"It is not a catalog of APIs. It is a model of who runs the work, who owns the state, who waits for whom, what establishes happens-before, how work stops, and how you measure that."},{type:"p",text:"The text assumes Go 1.23 or later in the go line of go.mod, and it notes where Go 1.25 changes the default GOMAXPROCS. When behavior depends on a version, that version is stated. Scheduler details outside the specification are a model of the runtime. They are not a contract of the language."}],links:[{platform:"instagram",label:"Lesson #01",href:"https://www.instagram.com/go_evangelist"},{platform:"x",label:"Lesson #01",href:"https://x.com/go_evangelist"},{platform:"linkedin",label:"Lesson #01",href:"https://www.linkedin.com/in/goevangelist"},{platform:"github",label:"Full course",href:"https://github.com/golang-evangelist/handbook/tree/main/golang%2Fgo-concurrency"}]},{title:"GoPath – Zero to Gopher",logo:p8,logoAlt:"GoPath – Zero to Gopher course logo",featured:!1,body:[{type:"p",text:"The course takes you from the first program to services, tests, concurrency, secure code, profiling, and tools around the Go ecosystem. Each lesson explains the mechanism, shows code, and breaks down the decision: why Go works exactly that way and what trade-off that decision carries."},{type:"p",text:"The target language version is Go 1.22+. Where a lesson depends on a newer API, that is noted in the text itself."},{type:"p",text:"The course has 227 lessons in three modules: 01-Basics, 02-Intermediate, and 03-Others. The basics are areas 01 through 08."}],links:[{platform:"instagram",label:"Full course",href:"https://www.instagram.com/p/De5MXs6ldnx/"},{platform:"x",label:"Lesson #01",href:"https://x.com/go_evangelist/status/2114117036620345756"},{platform:"linkedin",label:"Lesson #01",href:"https://www.linkedin.com/in/goevangelist"},{platform:"github",label:"Full course",href:"https://github.com/golang-evangelist/handbook/tree/main/golang%2Fgo-path"}]},{title:"Git Command Reference",logo:m8,logoAlt:"Git Command Reference course logo",featured:!1,body:[{type:"p",text:"A complete practical Git Command Reference for Developers, Software Engineers, and DevOps Engineers."},{type:"p",text:"This course is a structured reference of Git commands, organized into 35 thematic chapters. Each chapter is contained in a separate *.md file and can be read independently or as part of the complete Git guide."}],links:[{platform:"instagram",label:"Lesson #01",href:"https://www.instagram.com/p/DekccLmEhkG"},{platform:"x",label:"Lesson #01",href:"https://x.com/go_evangelist/status/2111197058824802392"},{platform:"linkedin",label:"Lesson #01",href:"https://www.linkedin.com/in/goevangelist"},{platform:"github",label:"Full course",href:"https://github.com/golang-evangelist/handbook/tree/main/git%2Fcommand-reference"}]},{title:"Go Testing Handbook",logo:g8,logoAlt:"Go Testing Handbook course logo",featured:!1,body:[{type:"p",text:"This course contains a comprehensive tutorial dedicated to testing in the Go (Golang) programming language."},{type:"p",text:"The goal is not only to explain how to write tests, but also to explain:"},{type:"ul",items:["why a particular testing technique exists,","when it should be used,","when it should be avoided,","and how experienced Go developers organize tests in production projects."]},{type:"p",text:"The documentation gradually progresses from basic concepts to advanced topics and is intended for developers who already know the Go language and want to improve the quality of their code."}],links:[{platform:"instagram",label:"Lesson #01",href:"https://www.instagram.com/p/DbQZaCADCBW/"},{platform:"x",
