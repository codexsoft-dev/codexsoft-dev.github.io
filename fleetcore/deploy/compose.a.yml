# Computer-A: Kafka (KRaft, jedan broker) + MongoDB.
# Go producer se u CORE-u pokreće na hostu, ne u ovom compose-u.
#
# Lokalno:  KAFKA_EXTERNAL_HOST=localhost
# LAN/WiFi: KAFKA_EXTERNAL_HOST=<IPv4 ovog računara>
#
# Upotreba:
#   copy env.a.example .env.a
#   docker compose --env-file .env.a -f compose.a.yml up -d

name: fleetrelay-a

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    container_name: fleetrelay-kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 15s
      retries: 18
      start_period: 40s
    restart: unless-stopped
    networks:
      - fleetrelay-a

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: fleetrelay-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_INIT_BROKER: kafka:29092
    volumes:
      - ./kafka-init.sh:/init/kafka-init.sh:ro
    entrypoint: ["/bin/bash", "/init/kafka-init.sh"]
    restart: "no"
    networks:
      - fleetrelay-a

  mongo:
    image: mongo:7.0
    hostname: mongo
    container_name: fleetrelay-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-fleetrelay}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-fleetrelay}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-fleetrelay}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_USER:-fleetrelay}",
          "-p",
          "${MONGO_PASSWORD:-fleetrelay}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - fleetrelay-a

volumes:
  kafka_data:
  mongo_data:

networks:
  fleetrelay-a:
    name: fleetrelay-a
    driver: bridge
